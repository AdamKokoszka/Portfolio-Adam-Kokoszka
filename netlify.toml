[build]
  command = "npm run generate"
  # On Netlify, Nitro uses the `netlify-static` preset, which outputs to `dist`
  # (together with `_redirects` and `_headers` generated from `routeRules`).
  publish = "dist"

# Secondary domains (Netlify domain aliases) all point to incocode.com.
[[redirects]]
  from = "https://www.incocode.pl/*"
  to = "https://incocode.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.incocode.pl/*"
  to = "https://incocode.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://incocode.pl/*"
  to = "https://incocode.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://incocode.pl/*"
  to = "https://incocode.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.adamkokoszka.pl/*"
  to = "https://incocode.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.adamkokoszka.pl/*"
  to = "https://incocode.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://adamkokoszka.pl/*"
  to = "https://incocode.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://adamkokoszka.pl/*"
  to = "https://incocode.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.adamkokoszka.com/*"
  to = "https://incocode.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.adamkokoszka.com/*"
  to = "https://incocode.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://adamkokoszka.com/*"
  to = "https://incocode.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://adamkokoszka.com/*"
  to = "https://incocode.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Not content-hashed, so cache for a day and revalidate in the background.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
